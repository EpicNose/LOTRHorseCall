buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
        maven {
            name = "jitpack"
            url = "https://jitpack.io"
        }
    }
    dependencies {
        classpath('com.github.GTNewHorizons:ForgeGradle:1.2.11') {
            exclude group: "org.eclipse.equinox"
            exclude group: "org.eclipse.jdt"
        }
    }
}

apply plugin: 'forge'

version = "1.1.0"
group = "com.epicnose.lotrcallablehorse"
archivesBaseName = "[LOTR召之马来]LOTRCallableHorse"

sourceCompatibility = 1.8
targetCompatibility = 1.8

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "run"
}

repositories {
    mavenCentral()
    maven {
        // Fix ForgeGradle on Gradle 6+
        name = "forge"
        url = "https://maven.minecraftforge.net/"
        metadataSources {
            artifact()
        }
    }
}

dependencies {
    compile fileTree(dir: 'libs', includes: ['*.jar'])
    compile fileTree(dir: 'lib', includes: ['*.jar'])
    compile fileTree(dir: '参考资料', includes: ['LOTRMod+v36.14.jar'])
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
